<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>লাইন ম্যানেজমেন্ট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #F4F5F1; --panel: #FFFFFF; --ink: #1C2B36; --muted: #6B7A85; --line: #DDE3E0;
    --navy: #1F3A5F; --amber: #D98E04; --ok: #2E7D5B; --danger: #B23A34; --warn: #C97A1A;
    --navy-dark: #16283F; --navy-light: #2C5182; --amber-light: #E8B04B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Hind Siliguri','Inter',system-ui,sans-serif;
    background: var(--bg); color: var(--ink);
  }
  #app { max-width: 1000px; margin: 0 auto; min-height: 100vh; background: var(--panel); }
  .center { display:flex; align-items:center; justify-content:center; min-height: 100vh; }
  .spin { animation: spin 1s linear infinite; color: var(--navy); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fm-header {
    display:flex; align-items:center; justify-content:space-between; padding: 16px 20px; color:#fff;
    background: linear-gradient(120deg, var(--navy-dark) 0%, var(--navy) 55%, var(--navy-light) 100%);
    box-shadow: 0 4px 18px rgba(15,30,50,0.28);
    position:relative; z-index:2;
  }
  .fm-header::after {
    content:""; position:absolute; left:0; right:0; bottom:-3px; height:3px;
    background: linear-gradient(90deg, var(--amber), #E8B04B, var(--amber));
  }
  .fm-header-left { display:flex; align-items:center; gap:10px; }
  .fm-title { font-weight:700; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size: 15px; letter-spacing:0.4px; }
  .saving-pill { font-size:11px; opacity:0.75; margin-left:8px; }
  .fm-header-right { display:flex; align-items:center; gap:10px; }
  select.line-select {
    appearance:none; background: rgba(255,255,255,0.14); color:#fff;
    border:1px solid rgba(255,255,255,0.32); padding: 7px 12px; border-radius: 20px; font-size: 12.5px; font-weight:600;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
  }
  .user-pill {
    background: linear-gradient(135deg, var(--amber), var(--amber-light)); color:#1C2B36; font-weight:700;
    padding: 6px 12px; border-radius: 20px; font-size: 12px; box-shadow: 0 2px 8px rgba(217,142,4,0.35);
  }
  .icon-btn { background: rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.18); color:#fff; padding:7px 10px; border-radius:8px; cursor:pointer; transition: background 0.15s; }
  .icon-btn:hover { background: rgba(255,255,255,0.24); }
  .icon-btn.ok { background: var(--ok); border-color: var(--ok); color:#fff; }
  .icon-btn.danger { background: var(--danger); border-color: var(--danger); color:#fff; }

  .fm-tabs { display:flex; gap:4px; padding: 10px 20px 0; border-bottom: 1px solid var(--line); }
  .fm-tab { display:flex; align-items:center; gap:6px; padding: 10px 14px; border:none; background:none; cursor:pointer; color: var(--muted); font-size: 13.5px; font-weight:600; border-bottom: 2px solid transparent; font-family: inherit; }
  .fm-tab.active { color: var(--navy); border-bottom-color: var(--amber); }

  .fm-main { padding: 18px 20px 40px; min-height: 300px; }

  .hazard-bar { height:5px; margin: 14px 0 18px; border-radius:3px; background: repeating-linear-gradient(135deg, var(--amber), var(--amber) 8px, var(--navy) 8px, var(--navy) 16px); opacity:0.85; }

  .login-wrap { display:flex; align-items:center; justify-content:center; padding: 40px 20px; min-height: 100vh; }
  .login-card { max-width: 420px; width:100%; }
  .login-brand { font-weight:700; color: var(--navy); font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:13px; letter-spacing:0.5px; }
  .login-card h1 { font-family:'Oswald',sans-serif; font-size:24px; margin: 4px 0 4px; }
  .muted { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
  .owner-btn { width:100%; display:flex; align-items:center; gap:10px; padding: 14px 16px; border-radius:10px; border:1.5px solid var(--navy); background: var(--navy); color:#fff; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; }
  .divider { display:flex; align-items:center; gap:10px; margin: 20px 0 14px; color: var(--muted); font-size:12px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background: var(--line); }
  .line-grid { display:grid; grid-template-columns: repeat(5,1fr); gap:8px; }
  .line-btn { padding: 12px 0; border-radius:8px; border:1px solid var(--line); background: var(--bg); cursor:pointer; }
  .line-btn:hover { border-color: var(--amber); }

  .tag { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; letter-spacing:0.5px; background: var(--amber); color:#fff; }
  .line-tag { display:inline-block; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; background: var(--navy); color:#fff; padding:4px 9px; border-radius:5px; }
  .line-tag.sm { font-size:11px; padding:2px 7px; }

  /* ---- Auth screen (wave login) ---- */
  .auth-page { min-height: 100vh; display:flex; align-items:flex-start; justify-content:center; background: #EAF2ED; }
  .auth-shell { width:100%; max-width: 420px; min-height: 100vh; background:#fff; position:relative; overflow:hidden; box-shadow: 0 0 40px rgba(0,0,0,0.08); }
  .auth-hero {
    position:relative; padding: 44px 28px 70px; text-align:center; color:#fff;
    background: linear-gradient(135deg, #163826 0%, #1F5C3F 45%, #4FA876 100%);
  }
  .auth-hero-icon {
    width:64px; height:64px; margin: 0 auto 18px; border-radius:50%; background: rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center; font-size: 28px; border: 1.5px solid rgba(255,255,255,0.35);
  }
  .auth-hero h1 { font-family:'Oswald',sans-serif; font-size: 25px; margin: 0 0 6px; font-weight:600; }
  .auth-hero p { margin:0; font-size: 13.5px; opacity: 0.88; line-height:1.5; }
  .auth-wave { position:absolute; left:0; right:0; bottom:-1px; width:100%; height:56px; display:block; }
  .auth-card { position:relative; margin: -40px 26px 0; background:#fff; border-radius: 18px; padding: 26px 22px 24px; box-shadow: 0 10px 30px rgba(23,66,45,0.14); }
  .auth-field { margin-bottom: 16px; }
  .auth-field label { display:block; font-size:12.5px; font-weight:700; color: var(--ink); margin-bottom: 7px; }
  .auth-input-wrap { display:flex; align-items:center; gap:8px; border: 1.3px solid var(--line); border-radius: 10px; padding: 11px 14px; background: #F7FAF8; }
  .auth-input-wrap:focus-within { border-color: #4FA876; background:#fff; }
  .auth-input-wrap span.ic { color:#8DA79A; font-size: 15px; flex-shrink:0; }
  .auth-input-wrap input { flex:1; border:none; background:none; outline:none; font-size: 14px; color: var(--ink); font-family:inherit; }
  .auth-toggle-eye { cursor:pointer; color:#8DA79A; font-size:14px; background:none; border:none; padding:0; }
  .auth-remember-row { display:flex; align-items:center; justify-content:space-between; margin: -4px 0 18px; font-size: 12.5px; color: var(--muted); }
  .auth-remember-row label { display:flex; align-items:center; gap:6px; }
  .auth-remember-row a { color: #1F5C3F; text-decoration:none; font-weight:600; }
  .auth-signin-btn {
    width:100%; padding: 13px; border:none; border-radius: 24px; font-weight:700; font-size: 14.5px; color:#fff; cursor:pointer;
    background: linear-gradient(135deg, #1F5C3F, #4FA876); box-shadow: 0 8px 18px rgba(31,92,63,0.3); font-family:inherit;
  }
  .auth-error { color: var(--danger); font-size:12.5px; margin: -6px 0 14px; text-align:center; }
  .auth-footnote { text-align:center; font-size: 12.5px; color: var(--muted); margin-top: 20px; padding-bottom: 8px; }

  .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .search-box, .date-box { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:7px; padding:7px 10px; background: var(--bg); color: var(--muted); }
  .search-box input, .date-box input { border:none; background:none; outline:none; font-size:13.5px; color: var(--ink); width:180px; font-family:inherit; }
  .check-inline { display:flex; align-items:center; gap:6px; font-size:13px; color: var(--muted); }
  .hint { color: var(--muted); font-size:13px; }
  .hint.inline { display:inline-flex; align-items:center; gap:4px; }

  .primary-btn { display:inline-flex; align-items:center; gap:6px; background: var(--navy); color:#fff; border:none; padding:9px 14px; border-radius:7px; font-weight:600; font-size:13.5px; cursor:pointer; margin-left:auto; font-family:inherit; }
  .primary-btn:disabled { opacity:0.45; cursor:not-allowed; }
  .ghost-btn { background:none; border:1px solid var(--line); padding:9px 14px; border-radius:7px; cursor:pointer; font-size:13.5px; font-family:inherit; }

  .form-card { background: var(--bg); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .form-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:12px; }
  .form-grid label { display:flex; flex-direction:column; gap:5px; font-size:12.5px; color: var(--muted); font-weight:600; }
  .form-grid input, .form-grid select { padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13.5px; color: var(--ink); background:#fff; font-family:inherit; }
  .form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }

  .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  .al-table thead th { background:#EAF2ED; color:#1F5C3F; }

  /* Absentee list: compact, wraps instead of horizontal-scrolling on mobile */
  .al-table { overflow-x:visible; }
  .al-table table { table-layout:fixed; width:100%; font-size:11px; }
  .al-table th, .al-table td { padding:6px 4px; word-break:break-word; white-space:normal; overflow-wrap:break-word; }
  .al-table thead th { font-size:9.5px; letter-spacing:0; line-height:1.25; }
  .al-table th:nth-child(1), .al-table td:nth-child(1) { width:8%; text-align:center; }
  .al-table th:nth-child(2), .al-table td:nth-child(2) { width:20%; }
  .al-table th:nth-child(3), .al-table td:nth-child(3) { width:24%; }
  .al-table th:nth-child(4), .al-table td:nth-child(4) { width:28%; }
  .al-table th:nth-child(5), .al-table td:nth-child(5) { width:20%; }
  .al-table .mono { font-size:10px; }
  .al-table .badge { font-size:9.5px; padding:2px 6px; white-space:normal; display:inline-block; line-height:1.3; }
  .badge-accent { background: var(--accent, var(--navy)); color:#fff; font-weight:700; }

  /* Line-wise duty breakdown: compact card per line */
  .lw-list { display:flex; flex-direction:column; gap:12px; }
  .lw-card {
    border:1px solid var(--line); border-left: 4px solid var(--accent, var(--navy)); border-radius:10px;
    padding:14px 16px; background:#fff; box-shadow: 0 2px 8px rgba(28,43,54,0.05);
  }
  .lw-card-head {
    display:flex; align-items:center; justify-content:space-between; margin: -14px -16px 10px; padding: 10px 16px;
    background: color-mix(in srgb, var(--accent, var(--navy)) 10%, #fff); border-radius: 8px 8px 0 0;
    border-bottom: 1px dashed var(--line);
  }
  .lw-card-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color: var(--accent, var(--navy)); }
  .lw-stats-grid { display:grid; grid-template-columns: repeat(6, 1fr); gap:8px 2px; padding:10px 0; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); }
  .lw-stat { display:flex; flex-direction:column; align-items:center; text-align:center; gap:2px; min-width:0; }
  .lw-stat-label { font-size:9.5px; color: var(--muted); text-transform:uppercase; letter-spacing:0.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .lw-stat-val { font-size:14px; font-weight:700; color: var(--ink); }
  .lw-card-period { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0 4px; font-size:13px; flex-wrap:wrap; }
  .lw-card-actions { display:flex; justify-content:flex-end; margin-top:8px; }
  .lw-card-actions .ghost-btn { padding:7px 12px; font-size:12.5px; }

  thead th { text-align:left; background: var(--bg); color: var(--muted); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px; padding:10px 12px; border-bottom:1px solid var(--line); }
  tbody td { padding:10px 12px; border-bottom:1px solid var(--line); }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr.row-inactive { opacity:0.55; }
  .mono { font-family:'JetBrains Mono',monospace; font-size:12.5px; }
  .empty-row { text-align:center; color: var(--muted); padding:24px !important; }

  .badge { font-size:11.5px; padding:3px 9px; border-radius:20px; font-weight:600; }
  .badge-ok { background:#E4F2EB; color: var(--ok); }
  .badge-muted { background:#EEEEEE; color: var(--muted); }
  .badge-warn { background:#FBF0DD; color: var(--warn); }
  .badge-danger { background:#FBE7E5; color: var(--danger); }

  .attend-btns { display:flex; gap:6px; }
  .chip { border:1px solid var(--line); background:#fff; padding:5px 10px; border-radius:20px; font-size:12px; cursor:pointer; font-family:inherit; }
  .chip-active { color:#fff; }

  .section-block { margin-top:22px; }
  .section-block h3 { font-family:'Oswald',sans-serif; font-size:14px; text-transform:uppercase; letter-spacing:0.4px; color: var(--navy); margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .count-pill { background: var(--amber); color:#fff; font-size:11px; padding:1px 7px; border-radius:10px; }
  .transfer-card { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; background: var(--bg); }

  .hist-list { display:flex; flex-direction:column; gap:8px; }
  .hist-card { border:1px solid var(--line); border-radius:10px; padding:11px 13px; background:#fff; }
  .hist-card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .hist-card-name { font-size:13.5px; color: var(--ink); }
  .hist-card-route { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .hist-arrow { color: var(--muted); font-size:13px; }
  .hist-card-dates { display:flex; justify-content:space-between; gap:8px; font-size:11px; color: var(--muted); flex-wrap:wrap; }
  .hist-card-dates .mono { color: var(--ink); font-weight:600; }
  .transfer-actions { display:flex; gap:6px; }

  .config-error { max-width: 560px; margin: 60px auto; padding: 24px; border: 1px solid var(--danger); background: #FBE7E5; border-radius: 10px; }
  .config-error h2 { margin-top:0; color: var(--danger); }
  .config-error code { background:#fff; padding: 2px 6px; border-radius: 4px; }

  /* ---- Line-user sidebar app ---- */
  .line-app { min-height:100vh; position:relative; }
  .line-topbar { display:flex; align-items:center; gap:10px; padding:14px 16px; background: var(--navy); color:#fff; position:sticky; top:0; z-index:5; }
  .line-topbar .hamburger { background: rgba(255,255,255,0.14); border:none; color:#fff; font-size:17px; padding:8px 12px; border-radius:8px; cursor:pointer; }
  .line-topbar .page-title { font-family:'Oswald',sans-serif; font-weight:600; font-size:14.5px; flex:1; text-transform:uppercase; letter-spacing:0.3px; }
  .line-content { padding:18px 16px 40px; max-width:1000px; margin:0 auto; }

  .line-drawer-overlay { position:fixed; inset:0; background:rgba(10,20,15,0.45); z-index:20; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .line-drawer-overlay.open { opacity:1; pointer-events:auto; }

  .line-drawer { position:fixed; top:0; left:0; bottom:0; width:84%; max-width:300px; background: linear-gradient(165deg, var(--navy-dark) 0%, var(--navy) 45%, var(--navy-light) 100%); color:#fff; z-index:21; transform:translateX(-105%); transition:transform .28s ease; display:flex; flex-direction:column; box-shadow: 8px 0 34px rgba(0,0,0,0.28); }
  .line-drawer.open { transform:translateX(0); }
  .line-drawer-brand { padding:26px 22px 16px; }
  .line-drawer-logo { width:46px; height:46px; border-radius:12px; background: rgba(255,255,255,0.16); display:flex; align-items:center; justify-content:center; font-size:21px; margin-bottom:14px; border:1px solid rgba(255,255,255,0.32); }
  .line-drawer-brand h2 { font-size:16.5px; margin:0 0 3px; font-weight:700; line-height:1.3; }
  .line-drawer-brand p { margin:0 0 13px; font-size:12px; opacity:0.82; }
  .line-drawer-pill { display:inline-block; background: rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.32); padding:4px 12px; border-radius:20px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; }
  .line-drawer-divider { height:1px; background: rgba(255,255,255,0.18); margin: 4px 20px 8px; }
  .line-drawer-nav { flex:1; overflow-y:auto; padding: 6px 12px; }
  .line-drawer-item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 13px; border-radius:14px; border:none; background:none; color:#fff; cursor:pointer; font-family:inherit; margin-bottom:5px; }
  .line-drawer-item .ic { width:34px; height:34px; border-radius:9px; background: rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .line-drawer-item .lbl-bn { font-size:14px; font-weight:700; display:block; }
  .line-drawer-item .lbl-en { font-size:11px; opacity:0.75; }
  .line-drawer-item.active { background:#fff; color:#163826; }
  .line-drawer-item.active .ic { background:#E4F2EB; }
  .line-drawer-item.active .lbl-en { color:#4C7A63; opacity:1; }
  .line-drawer-footer { padding:12px 18px 20px; border-top:1px solid rgba(255,255,255,0.15); }
  .line-drawer-logout { display:flex; align-items:center; gap:10px; background: rgba(255,255,255,0.12); border:none; color:#fff; width:100%; padding:11px 14px; border-radius:12px; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:600; }

  .stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:18px; }
  .stat-card {
    background:linear-gradient(160deg,#fff, #FAFBF9); border:1px solid var(--line); border-radius:14px; padding:16px 16px 14px;
    position:relative; overflow:hidden; box-shadow: 0 2px 10px rgba(28,43,54,0.06);
    border-top: 3px solid var(--navy);
  }
  .stat-card.ok { border-top-color: var(--ok); }
  .stat-card.danger { border-top-color: var(--danger); }
  .stat-card.warn { border-top-color: var(--warn); }
  .stat-card.muted { border-top-color: var(--muted); grid-column: span 2; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
  .stat-card.muted .num { font-size:20px; }
  .stat-card.muted .lbl { margin-top:0; }
  .stat-card .num { font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; color: var(--navy); line-height:1; }
  .stat-card.ok .num { color: var(--ok); }
  .stat-card.danger .num { color: var(--danger); }
  .stat-card.warn .num { color: var(--warn); }
  .stat-card .lbl { font-size:12px; color: var(--muted); margin-top:6px; font-weight:600; }
  .quick-links { display:flex; flex-direction:column; gap:8px; }
  .quick-link-btn { display:flex; align-items:center; gap:10px; padding:13px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:600; color: var(--ink); text-align:left; }
  .quick-link-btn:hover { border-color: var(--amber); }
  .quick-link-btn .ic { font-size:17px; }

  /* ---- Employee Master (redesign) ---- */
  .pm-stat-grid { border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:16px; background:#fff; }
  .pm-stat-row { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
  .pm-stat-row:last-child { border-bottom:none; }
  .pm-stat-row .lbl { font-size:13.5px; font-weight:600; color: var(--ink); }
  .pm-stat-row .num { font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; color: var(--navy); }
  .pm-stat-row.ok .num { color: var(--ok); }
  .pm-stat-row.danger .num { color: var(--danger); }
  .pm-stat-row.warn .num { color: var(--warn); }
  .pm-stat-row.muted .num { color: var(--muted); }
  .pm-stat-grid-inline { display:flex; flex-direction:row; }

/* ---------- Notifications: absence alerts + work-anniversary ---------- */
const ABSENT_ALERT_MIN_COUNT = 3;
const ABSENT_ALERT_MIN_PCT = 20;

function getWorkAnniversaries(pool){
  const today = new Date();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");
  return pool
    .filter(e => e.status === "active" && e.joinDate && e.joinDate.slice(5,7) === mm && e.joinDate.slice(8,10) === dd)
    .map(e => ({ emp: e, years: today.getFullYear() - parseInt(e.joinDate.slice(0,4),10) }))
    .filter(x => x.years > 0);
}

function getAbsentAlerts(activeLine, isOwner){
  const today = todayStr();
  const lines = (isOwner && activeLine === "ALL") ? getLines() : [activeLine];
  const alerts = [];
  lines.forEach(line => {
    const emps = state.employees.filter(e => e.line === line && e.status === "active");
    if (emps.length === 0) return;
    const absentCount = state.attendance.filter(a => a.date === today && a.line === line && a.status === "absent").length;
    const pct = Math.round((absentCount/emps.length)*100);
    if (absentCount >= ABSENT_ALERT_MIN_COUNT && pct >= ABSENT_ALERT_MIN_PCT) {
      alerts.push({ line, absentCount, total: emps.length, pct });
    }
  });
  return alerts.sort((a,b) => b.pct - a.pct);
}

function getNotifications(activeLine, isOwner){
  const pool = (isOwner && activeLine === "ALL") ? state.employees : state.employees.filter(e => e.line === activeLine);
  const items = [];
  getAbsentAlerts(activeLine, isOwner).forEach(a => items.push({
    icon: "⚠️",
    title: `${a.line} লাইনে অনুপস্থিতি বেশি`,
    desc: `আজ ${a.total} জনের মধ্যে ${a.absentCount} জন (${a.pct}%) অনুপস্থিত`
  }));
  getWorkAnniversaries(pool).forEach(({emp, years}) => items.push({
    icon: "🎉",
    title: `${emp.name} — কর্মদিবস বার্ষিকী`,
    desc: `${emp.code} • ${esc(emp.line)} লাইনে আজ ${years} বছর পূর্ণ হলো`
  }));
  return items;
}

/* ---------- Monthly attendance report export (Excel / PDF) ---------- */
function daysInMonth(ym){ const [y,m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); }

function buildMonthlyMatrix(pool, month){
  const numDays = daysInMonth(month);
  const activePool = [...pool].filter(e => e.status === "active").sort((a,b) => a.name.localeCompare(b.name,"bn"));
  const header = ["আইডি","নাম","লাইন","পদবি", ...Array.from({length:numDays}, (_,i) => String(i+1)), "উপস্থিত","অনুপস্থিত","ছুটি","সাপ্তাহিক","লেট"];
  const rows = activePool.map(emp => {
    const recs = {};
    state.attendance.filter(a => a.employeeId === emp.id && (a.date||"").slice(0,7) === month).forEach(a => { recs[a.date] = a.status; });
    let p=0, ab=0, l=0, w=0, lt=0;
    const dayCells = Array.from({length:numDays}, (_,i) => {
      const date = `${month}-${String(i+1).padStart(2,"0")}`;
      const st = recs[date];
      if (st === "present") p++; else if (st === "absent") ab++; else if (st === "leave") l++; else if (st === "weekend") w++; else if (st === "late") lt++;
      return st ? (STATUS_ABBR[st] || "") : "";
    });
    return [emp.code, emp.name, emp.line, emp.designation || "", ...dayCells, p, ab, l, w, lt];
  });
  return { header, rows };
}

function exportMonthlyAttendanceExcel(pool, month, activeLine){
  if (typeof XLSX === "undefined") { alert("Excel লাইব্রেরি লোড হয়নি — ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন।"); return; }
  const { header, rows } = buildMonthlyMatrix(pool, month);
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws["!cols"] = header.map((_, i) => (i === 1 ? { wch: 20 } : { wch: 7 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Attendance");
  XLSX.writeFile(wb, `attendance_${activeLine}_${month}.xlsx`);
}

function exportMonthlyAttendancePDF(pool, month, activeLine){
  const { header, rows } = buildMonthlyMatrix(pool, month);
  const w = window.open("", "_blank");
  if (!w) { alert("পপআপ ব্লক হয়েছে — ব্রাউজার সেটিংসে এই সাইটের জন্য পপআপ অনুমতি দিন।"); return; }
  const style = `<style>
    body{font-family:sans-serif; padding:16px;} h2{margin:0 0 4px;} p{margin:0 0 14px; color:#555; font-size:12px;}
    table{border-collapse:collapse; width:100%; font-size:9px;} th,td{border:1px solid #ccc; padding:3px 4px; text-align:center;}
    th{background:#1F3A5F; color:#fff;} td:nth-child(2){text-align:left;}
  </style>`;
  const tableHtml = `<table><thead><tr>${header.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  w.document.write(`<!DOCTYPE html><html><head><title>Attendance Report</title>${style}</head>
    <body><h2>মাসিক হাজিরা রিপোর্ট — ${esc(activeLine)}</h2><p>${esc(monthLabel(month))}</p>${tableHtml}
    <script>window.onload = () => { window.print(); };<` + `/script></body></html>`);
  w.document.close();
}

/* ---------- Profile photo upload (resized client-side before upload) ---------- */
function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
      else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("resize failed")), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("ছবি লোড করা যায়নি")); };
    img.src = url;
  });
}
async function uploadProfilePhoto(username, file){
  if (!file) return;
  if (!file.type.startsWith("image/")) { alert("শুধুমাত্র ছবি ফাইল আপলোড করুন"); return; }
  await withSaving(async () => {
    const blob = await resizeImageFile(file, 500);
    const path = `profile_photos/${normUsername(username)}_${Date.now()}.jpg`;
    const r = storageRef(storage, path);
    await uploadBytes(r, blob, { contentType: "image/jpeg" });
    const url = await getDownloadURL(r);
    await updateDoc(doc(db, "users", normUsername(username)), { photoURL: url });
    state.user = { ...state.user, photoURL: url };
    localStorage.setItem("fm_user", JSON.stringify(state.user));
  });
}
async function saveRoleLabel(username, label){
  const trimmed = (label || "").trim();
  await withSaving(async () => {
    await updateDoc(doc(db, "users", normUsername(username)), { roleLabel: trimmed || null });
    state.user = { ...state.user, roleLabel: trimmed || null };
    localStorage.setItem("fm_user", JSON.stringify(state.user));
  });
}
async function saveTheme(username, themeKey){
  await withSaving(async () => {
    await updateDoc(doc(db, "users", normUsername(username)), { theme: themeKey });
    state.user = { ...state.user, theme: themeKey };
    localStorage.setItem("fm_user", JSON.stringify(state.user));
    applyTheme(themeKey);
  });
}

/* ---------- Focus preservation across re-renders ----------
   Every render() call replaces app.innerHTML, which destroys and
   recreates the DOM (including any focused <input>). On mobile this
   closes the on-screen keyboard on every keystroke (e.g. typing or
   backspacing in the employee search box). We snapshot the focused
   field's id + cursor position before re-rendering, then restore
   focus + cursor after, so typing/backspacing feels continuous. */
function captureFocus(){
  const el = document.activeElement;
  if (!el || !el.id || !document.getElementById("app").contains(el)) return null;
  if (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA") return null;
  let selStart = null, selEnd = null;
  try { selStart = el.selectionStart; selEnd = el.selectionEnd; } catch(e) {}
  return { id: el.id, selStart, selEnd };
}
function restoreFocus(info){
  if (!info) return;
  const el = document.getElementById(info.id);
  if (!el) return;
  el.focus();
  if (info.selStart !== null && info.selEnd !== null && typeof el.setSelectionRange === "function") {
    try { el.setSelectionRange(info.selStart, info.selEnd); } catch(e) {}
  }
}

async function renameLine(oldCode, newCode){
  if (!newCode || oldCode === newCode) return;
  if (state.lines.some(l => l.toLowerCase() === newCode.toLowerCase())) {
    alert(`"${newCode}" লাইন আগে থেকেই আছে।`);
    return;
  }
  if (!confirm(`"${oldCode}" লাইনের নাম পরিবর্তন করে "${newCode}" করবেন? সংশ্লিষ্ট সব কর্মচারী, ইউজার ও ট্রান্সফার রেকর্ড আপডেট হবে।`)) return;
  await withSaving(async () => {
    const batch = writeBatch(db);
    batch.set(doc(db, "lines", newCode), { createdAt: Date.now() });
    batch.delete(doc(db, "lines", oldCode));
    state.employees.filter(e => e.line === oldCode || (Array.isArray(e.lineHistory) && e.lineHistory.some(h => h.line === oldCode))).forEach(e => {
      const patch = {};
      if (e.line === oldCode) patch.line = newCode;
      if (Array.isArray(e.lineHistory) && e.lineHistory.some(h => h.line === oldCode)) {
        patch.lineHistory = getLineHistory(e).map(h => h.line === oldCode ? { ...h, line: newCode } : h);
      }
      batch.update(doc(db, "employees", e.id), patch);
    });
    state.users.filter(u => u.line === oldCode).forEach(u => {
      batch.update(doc(db, "users", u.username), { line: newCode });
    });
    state.transfers.filter(t => t.fromLine === oldCode).forEach(t => {
      batch.update(doc(db, "transfers", t.id), { fromLine: newCode });
    });
    state.transfers.filter(t => t.toLine === oldCode).forEach(t => {
      batch.update(doc(db, "transfers", t.id), { toLine: newCode });
    });
    await batch.commit();
  });
  if (state.viewLine === oldCode) state.viewLine = newCode;
}

function exportEmployeesCSV(list){
  const headers = ["কোড","নাম","ফোন","ব্লাড গ্রুপ","লাইন","যোগদান","স্ট্যাটাস"];
  const rows = list.map(e => [e.code, e.name, e.phone||"", e.bloodGroup||"", e.line, e.joinDate||"", e.status==="active"?"Active":"Inactive"]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${(v??"").toString().replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `employees_${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function decideTransfer(transfer, approve){
  await withSaving(async () => {
    const decisionDate = todayStr();
    const batch = writeBatch(db);
    batch.update(doc(db, "transfers", transfer.id), {
      status: approve ? "approved" : "rejected", decisionDate
    });
    const oldEmp = state.employees.find(e => e.id === transfer.employeeId);
    if (oldEmp) {
      if (approve) {
        const history = getLineHistory(oldEmp).map(h => ({ ...h }));
        const openStint = [...history].reverse().find(h => !h.to);
        if (openStint) openStint.to = decisionDate;
        else history.push({ line: transfer.fromLine, from: oldEmp.joinDate || decisionDate, to: decisionDate });
        history.push({ line: transfer.toLine, from: decisionDate, to: null });
        batch.update(doc(db, "employees", oldEmp.id), {
          line: transfer.toLine, status: "active", transferPending: false,
          transferNote: `${transfer.fromLine} থেকে ${transfer.toLine}-এ ট্রান্সফার হয়েছে (${fmtDate(decisionDate)})`,
          lineHistory: history
        });
      } else {
        batch.update(doc(db, "employees", oldEmp.id), {
          status: "active", transferPending: false,
          transferNote: `${transfer.toLine}-এ ট্রান্সফার রিজেক্ট হয়েছে (${fmtDate(decisionDate)})`
        });
      }
    }
    await batch.commit();
  });
}

async function cancelTransfer(transfer){
  await withSaving(async () => {
    const decisionDate = todayStr();
    const batch = writeBatch(db);
    batch.update(doc(db, "transfers", transfer.id), {
      status: "cancelled", decisionDate
    });
    const emp = state.employees.find(e => e.id === transfer.employeeId);
    if (emp) {
      batch.update(doc(db, "employees", emp.id), {
        status: "active", transferPending: false,
        transferNote: `${transfer.toLine}-এ ট্রান্সফার বাতিল করা হয়েছে (${fmtDate(decisionDate)})`
      });
    }
    await batch.commit();
  });
}

/* ---------- Render ---------- */
function render(){
  const _focus = captureFocus();
  _render();
  restoreFocus(_focus);
}

let _themeApplied = false;
function _render(){
  if (!state.loaded.users) { app.innerHTML = `<div style="padding:24px; max-width:1000px; margin:0 auto;">${renderFullSkeleton()}</div>`; return; }
  if (state.user && !_themeApplied) { applyTheme(state.user.theme || "navy"); _themeApplied = true; }
  if (!state.user) { renderLogin(); return; }
  if (state.user.role !== "owner") { renderLineApp(); return; }
  const activeLine = state.user.role === "owner" ? state.viewLine : state.user.line;
  const isOwner = state.user.role === "owner";
  const stillLoading = !state.loaded.employees || !state.loaded.attendance || !state.loaded.transfers || !state.loaded.lines || !state.loaded.designations;

  const ownerMenuItems = OWNER_MENU.filter(m => isOwner || ["employees","attendance","transfers"].includes(m.id));
  const activeMenuItem = ownerMenuItems.find(m => m.id === state.tab) || ownerMenuItems[0];

  app.innerHTML = `
    <header class="fm-header">
      <div class="fm-header-left">
        <button class="hamburger" id="fmOpenBtn">☰</button>
        <span class="fm-title">${activeMenuItem.icon} ${activeMenuItem.bn}</span>
        ${state.saving ? `<span class="saving-pill">সংরক্ষণ হচ্ছে…</span>` : ""}
      </div>
      <div class="fm-header-right">
        ${isOwner ? `
          <select class="line-select" id="viewLineSelect">
            <option value="ALL" ${state.viewLine==="ALL"?"selected":""}>সব লাইন</option>
            ${getLines().map(l => `<option value="${l}" ${state.viewLine===l?"selected":""}>${l}</option>`).join("")}
          </select>
        ` : `<span class="line-tag">${state.user.line}</span>`}
        ${renderNotifBell(activeLine, isOwner)}
        <span class="user-pill">${isOwner ? "মালিক" : "লাইন "+state.user.line}</span>

let searchUI = { empId: null, empText: "", month: todayStr().slice(0,7), filterType: "absent_leave", lifetime: true };
let absentUI = { date: todayStr() };

const BN_WEEKDAYS = ["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
const SEARCH_FILTERS = [
  { id: "all", label: "সকল রেকর্ড (All Records)" },
  { id: "present", label: "উপস্থিত (Present)" },
  { id: "absent", label: "অনুপস্থিত (Absent)" },
  { id: "leave", label: "ছুটি (Leave)" },
  { id: "absent_leave", label: "অনুপস্থিত + ছুটি (Absent + Leave)" },
  { id: "weekend", label: "সাপ্তাহিক ছুটি (Weekend)" },
  { id: "late", label: "লেট (Late)" }
];
function monthLabel(ym){
  const [y,m] = ym.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
}
function monthOptionsList(){
  const months = new Set([todayStr().slice(0,7)]);
  state.attendance.forEach(a => { if (a.date) months.add(a.date.slice(0,7)); });
  return [...months].sort().reverse();
}
function matchesSearchFilter(status, filterType){
  if (filterType === "all") return true;
  if (filterType === "absent_leave") return status === "absent" || status === "leave";
  return status === filterType;
}
function statusBadgeClass(status){
  return { present:"badge-ok", absent:"badge-danger", leave:"badge-warn", weekend:"badge-navy", late:"badge-purple" }[status] || "badge-muted";
}

/* ----- Dashboard ----- */
function renderDashboardPage(activeLine){
  const employees = state.employees.filter(e => e.line === activeLine);
  const activeEmployees = employees.filter(e => e.status === "active");
  const today = todayStr();
  const todayRecs = state.attendance.filter(a => a.date === today && a.line === activeLine);
  const present = todayRecs.filter(a => a.status === "present" || a.status === "late").length;
  const absent = todayRecs.filter(a => a.status === "absent").length;
  const leave = todayRecs.filter(a => a.status === "leave").length;
  const notMarked = Math.max(activeEmployees.length - todayRecs.length, 0);
  const pendingIncoming = state.transfers.filter(t => t.status === "pending" && t.toLine === activeLine).length;

  const desigCounts = {};
  activeEmployees.forEach(e => { const d = e.designation || "অনির্ধারিত"; desigCounts[d] = (desigCounts[d]||0)+1; });
  const desigRows = Object.entries(desigCounts).sort((a,b) => b[1]-a[1]);

  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${activeEmployees.length}</div><div class="lbl">মোট অ্যাক্টিভ এমপ্লয়ি</div></div>
      <div class="stat-card ok"><div class="num">${present}</div><div class="lbl">আজ উপস্থিত</div></div>
      <div class="stat-card danger"><div class="num">${absent}</div><div class="lbl">আজ অনুপস্থিত</div></div>
      <div class="stat-card warn"><div class="num">${leave}</div><div class="lbl">আজ ছুটি</div></div>
    </div>
    ${notMarked>0 ? `<p class="hint" style="margin-bottom:16px">⚠️ আজ এখনো ${notMarked} জনের হাজিরা দেওয়া হয়নি।</p>` : ""}
    ${desigRows.length>0 ? `
    <div class="table-wrap" style="margin-bottom:16px;">
      <table>
        <thead><tr><th>পদবি (Designation)</th><th style="text-align:right;">সংখ্যা (Count)</th></tr></thead>
        <tbody>
          ${desigRows.map(([d,c]) => `<tr><td>${esc(d)}</td><td style="text-align:right;font-weight:700;color:var(--navy);">${c}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>` : ""}
    ${pendingIncoming>0 ? `<button class="quick-link-btn" data-goto="transfers" style="border-color:var(--amber);margin-bottom:16px;"><span class="ic">🔁</span> ${pendingIncoming}টি ইনকামিং ট্রান্সফার রিকোয়েস্ট পেন্ডিং আছে — দেখুন</button>` : ""}
    <div class="quick-links" style="margin-bottom:16px;">
      <button class="quick-link-btn" data-goto="todayAttendance"><span class="ic">🗓️</span> আজকের হাজিরা নিন</button>
      <button class="quick-link-btn" data-goto="search"><span class="ic">🔍</span> কর্মচারী খুঁজুন</button>
      <button class="quick-link-btn" data-goto="absentList"><span class="ic">📋</span> অনুপস্থিত তালিকা দেখুন</button>
      <button class="quick-link-btn" data-goto="master"><span class="ic">👥</span> কর্মচারী মাস্টার</button>
    </div>
    <button class="export-trigger-btn" id="openReportModalBtn" type="button">📊 মাসিক হাজিরা রিপোর্ট এক্সপোর্ট (Excel/PDF)</button>
  `;
}

      <div class="srch-profile-row"><span class="k">রক্তের গ্রুপ</span><span class="v">${esc(emp.bloodGroup)||"—"}</span></div>
      <div class="srch-profile-row"><span class="k">অবস্থা (Status)</span><span class="v">${emp.status==="active"?`<span class="badge badge-ok">Active</span>`:`<span class="badge badge-muted">Inactive</span>`}</span></div>
      <div class="srch-profile-row"><span class="k">ঠিকানা (Address)</span><span class="v">${esc(emp.address)||"—"}</span></div>
    </div>

    <div class="srch-section">
      <div class="srch-section-head">সর্বমোট হাজিরার তথ্য (${searchUI.lifetime ? "Lifetime Attendance" : "Monthly Attendance"} — ${scopeLabel})</div>
      <div class="srch-stat-row ok"><span class="lbl">Present</span><span class="num">${counts.present}</span></div>

function renderTab(activeLine, isOwner){
  if (state.tab === "dashboard" && isOwner) return renderOwnerDashboardTab();
  if (state.tab === "employees") return renderEmployeesTab(activeLine, isOwner);
  if (state.tab === "search") return renderOwnerSearchTab(activeLine, isOwner);
  if (state.tab === "attendance") return renderAttendanceTab(activeLine, isOwner);
  if (state.tab === "transfers") return renderTransfersTab(activeLine, isOwner);
  if (state.tab === "history" && isOwner) return renderHistoryTab();
  if (state.tab === "lines" && isOwner) return renderLinesTab();
  if (state.tab === "designations" && isOwner) return renderDesignationsTab();
  if (state.tab === "users" && isOwner) return renderUsersTab();
  return "";
}

function bindTabEvents(activeLine, isOwner){
  document.querySelectorAll("#fmDrawer .line-drawer-item").forEach(btn => {
    btn.onclick = () => setState({ tab: btn.dataset.tab, sidebarOpen: false });
  });
  if (state.tab === "dashboard" && isOwner) bindOwnerDashboardEvents();
  if (state.tab === "history" && isOwner) bindHistoryEvents();
  if (state.tab === "employees") bindEmployeesEvents(activeLine);
  if (state.tab === "search") bindOwnerSearchTabEvents(activeLine);
  if (state.tab === "attendance") bindAttendanceEvents(activeLine);
  if (state.tab === "transfers") bindTransfersEvents(isOwner ? state.viewLine : state.user.line, isOwner);
  if (state.tab === "lines" && isOwner) bindLinesEvents();
  if (state.tab === "designations" && isOwner) bindDesignationsEvents();
  if (state.tab === "users" && isOwner) bindUsersEvents();
}

let ownerSearchUI = { empId: null, empText: "", month: todayStr().slice(0,7), filterType: "all", lifetime: true, expandedLine: null };

function ownerSearchPool(activeLine){
  return activeLine === "ALL" ? state.employees : state.employees.filter(e => e.line === activeLine);
}

function renderOwnerSearchTab(activeLine, isOwner){
  const pool = ownerSearchPool(activeLine);
  const sortedPool = [...pool].sort((a,b) => (a.line||"").localeCompare(b.line||"", undefined, {numeric:true}) || a.name.localeCompare(b.name,"bn"));
  const emp = ownerSearchUI.empId ? pool.find(e => e.id === ownerSearchUI.empId) : null;
  const months = monthOptionsList();
  if (!months.includes(ownerSearchUI.month)) months.unshift(ownerSearchUI.month);

  const filterHtml = `
    <div class="srch-card">
      <div class="srch-field">
        <input class="srch-input" id="osEmpInput" list="osEmpList" placeholder="আইডি, নাম বা লাইন দিয়ে কর্মচারী খুঁজুন" value="${esc(ownerSearchUI.empText)}" autocomplete="off">
        <datalist id="osEmpList">
          ${sortedPool.map(e => `<option value="${esc(e.code)} - ${esc(e.name)} (${esc(e.line)})"></option>`).join("")}
        </datalist>
      </div>
      <div class="srch-field">
        <select class="srch-select" id="osMonth" ${ownerSearchUI.lifetime ? "disabled" : ""}>
          ${months.map(m => `<option value="${m}" ${m===ownerSearchUI.month?"selected":""}>${monthLabel(m)}</option>`).join("")}
        </select>
      </div>
      <div class="srch-field">
        <select class="srch-select" id="osFilterType">
          ${SEARCH_FILTERS.map(f => `<option value="${f.id}" ${f.id===ownerSearchUI.filterType?"selected":""}>${f.label}</option>`).join("")}
        </select>
      </div>
      <div class="srch-field">
        <label class="srch-checkbox-row"><input type="checkbox" id="osLifetime" ${ownerSearchUI.lifetime?"checked":""}> লাইফটাইম (এ পর্যন্ত সব ডেটা)</label>
      </div>
    </div>
  `;

  if (!emp) {
    return `${filterHtml}
      <div class="srch-empty">আইডি, নাম বা লাইন দিয়ে একজন কর্মচারী খুঁজুন — ফলাফল এখানে দেখানো হবে।</div>`;
  }

  const allRecs = state.attendance.filter(a => a.employeeId === emp.id);
  const scoped = ownerSearchUI.lifetime ? allRecs : allRecs.filter(a => (a.date||"").slice(0,7) === ownerSearchUI.month);
  const scopeLabel = ownerSearchUI.lifetime ? "সর্বমোট (Lifetime)" : monthLabel(ownerSearchUI.month);

  const counts = { present:0, absent:0, leave:0, weekend:0, late:0 };
  scoped.forEach(a => { if (counts[a.status] !== undefined) counts[a.status]++; });
  const dutyDays = counts.present + counts.late;

  const filterLabel = SEARCH_FILTERS.find(f => f.id === ownerSearchUI.filterType)?.label || "";
  const filteredRows = scoped
    .filter(a => matchesSearchFilter(a.status, ownerSearchUI.filterType))
    .sort((a,b) => (b.date||"").localeCompare(a.date||""));

  return `
    ${filterHtml}
    <div class="toolbar"><button class="ghost-btn" id="osBackBtn">← তালিকায় ফিরুন</button></div>
    <div class="srch-section">
      <div class="srch-section-head">প্রোফাইল তথ্য (PROFILE)</div>
      <div class="srch-profile-row"><span class="k">Employee ID</span><span class="v mono">${esc(emp.code)}</span></div>
      <div class="srch-profile-row"><span class="k">নাম (Name)</span><span class="v">${esc(emp.name)}</span></div>
      <div class="srch-profile-row"><span class="k">লাইন (Line)</span><span class="v"><span class="line-tag sm">${esc(emp.line)}</span></span></div>
      <div class="srch-profile-row"><span class="k">বিভাগ (Department)</span><span class="v">${esc(emp.department)||"—"}</span></div>
      <div class="srch-profile-row"><span class="k">পদবি (Designation)</span><span class="v">${esc(emp.designation)||"—"}</span></div>
      <div class="srch-profile-row"><span class="k">যোগদানের তারিখ</span><span class="v">${esc(emp.joinDate)||"—"}</span></div>
      <div class="srch-profile-row"><span class="k">মোবাইল (Phone)</span><span class="v">${esc(emp.phone)||"—"}</span></div>
      <div class="srch-profile-row"><span class="k">রক্তের গ্রুপ</span><span class="v">${esc(emp.bloodGroup)||"—"}</span></div>
      <div class="srch-profile-row"><span class="k">অবস্থা (Status)</span><span class="v">${emp.status==="active"?`<span class="badge badge-ok">Active</span>`:`<span class="badge badge-muted">Inactive</span>`}</span></div>
      <div class="srch-profile-row"><span class="k">ঠিকানা (Address)</span><span class="v">${esc(emp.address)||"—"}</span></div>
    </div>

    <div class="srch-section">
      <div class="srch-section-head">সর্বমোট হাজিরার তথ্য (${ownerSearchUI.lifetime ? "Lifetime Attendance" : "Monthly Attendance"} — ${scopeLabel})</div>
      <div class="srch-stat-row ok"><span class="lbl">মোট ডিউটি দিন (Present + Late)</span><span class="num">${dutyDays}</span></div>
      <div class="srch-stat-row ok"><span class="lbl">Present</span><span class="num">${counts.present}</span></div>
      <div class="srch-stat-row danger"><span class="lbl">Absent</span><span class="num">${counts.absent}</span></div>
      <div class="srch-stat-row warn"><span class="lbl">Leave</span><span class="num">${counts.leave}</span></div>
      <div class="srch-stat-row navy"><span class="lbl">Weekend/Off</span><span class="num">${counts.weekend}</span></div>
      <div class="srch-stat-row purple"><span class="lbl">Late</span><span class="num">${counts.late}</span></div>
    </div>

    ${renderLineWiseBreakdown(scoped, scopeLabel)}

    <div class="section-block">
      <h3>${filterLabel} তারিখ — ${scopeLabel} — মোট ${filteredRows.length} দিন</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>ক্রম</th><th>তারিখ (Date)</th><th>বার (Day)</th><th>অবস্থা (Status)</th></tr></thead>
        <tbody>
          ${filteredRows.length===0 ? `<tr><td colspan="4" class="empty-row">কোনো রেকর্ড পাওয়া যায়নি</td></tr>` : filteredRows.map((r,i) => `
            <tr>
              <td>${i+1}</td>
              <td class="mono">${esc(r.date)}</td>
              <td>${BN_WEEKDAYS[new Date(r.date).getDay()]}</td>
              <td><span class="badge ${statusBadgeClass(r.status)}">${STATUS_LABEL[r.status]||r.status}</span></td>
            </tr>`).join("")}
        </tbody>
      </table></div>
    </div>
  `;
}

function renderLineWiseBreakdown(scoped, scopeLabel){
  const byLine = summarizeByLine(scoped);
  const lineNames = Object.keys(byLine).sort((a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:"base"}));
  if (lineNames.length === 0) return "";
  return `
    <div class="srch-section">
      <div class="srch-section-head">লাইন অনুযায়ী ডিউটির খতিয়ান (Line-wise Duty Breakdown — ${scopeLabel})</div>
      <div class="lw-list">
        ${lineNames.map(line => {
          const g = byLine[line];
          const gDuty = g.present + g.late;
          const period = g.firstDate && g.lastDate
            ? (g.firstDate === g.lastDate ? fmtDate(g.firstDate) : `${fmtDate(g.firstDate)} – ${fmtDate(g.lastDate)}`)
            : "—";
          const isOpen = ownerSearchUI.expandedLine === line;
          const stats = [
            ["ডিউটি", gDuty],
            ["উপস্থিত", g.present],
            ["অনুপস্থিত", g.absent],
            ["ছুটি", g.leave],
            ["সাপ্তাহিক", g.weekend],
            ["লেট", g.late],
          ];
          let card = `
          <div class="lw-card">
            <div class="lw-card-head">
              <span class="lw-card-title">লাইন</span>
              <span class="line-tag sm">${esc(line)}</span>
            </div>
            <div class="lw-stats-grid">
              ${stats.map(([label,val]) => `
                <div class="lw-stat">
                  <span class="lw-stat-label">${label}</span>
                  <span class="lw-stat-val">${val}</span>
                </div>`).join("")}
            </div>
            <div class="lw-card-period">
              <span class="lw-stat-label">সময়কাল</span>
              <span class="mono">${period}</span>
            </div>
            <div class="lw-card-actions">
              <button class="ghost-btn os-line-toggle" data-line-toggle="${esc(line)}">${isOpen ? "লুকান" : "ডাটা দেখুন (Full View)"}</button>
            </div>
          </div>`;
          if (isOpen) {
            const lineRecs = scoped.filter(r => (r.line || "—") === line).sort((a,b) => (b.date||"").localeCompare(a.date||""));
            card += `
            <div class="table-wrap" style="margin:0 0 14px;">
              <table>
                <thead><tr><th>ক্রম</th><th>তারিখ (Date)</th><th>বার (Day)</th><th>অবস্থা (Status)</th></tr></thead>
                <tbody>
                  ${lineRecs.length===0 ? `<tr><td colspan="4" class="empty-row">কোনো রেকর্ড পাওয়া যায়নি</td></tr>` : lineRecs.map((r,i) => `
                    <tr>
                      <td>${i+1}</td>
                      <td class="mono">${esc(r.date)}</td>
                      <td>${BN_WEEKDAYS[new Date(r.date).getDay()]}</td>
                      <td><span class="badge ${statusBadgeClass(r.status)}">${STATUS_LABEL[r.status]||r.status}</span></td>
                    </tr>`).join("")}
                </tbody>
              </table>
            </div>`;
          }
          return card;
        }).join("")}
      </div>
    </div>
  `;
}

function bindOwnerSearchTabEvents(activeLine){
  const pool = ownerSearchPool(activeLine);
  const empInput = document.getElementById("osEmpInput");
  if (empInput) empInput.oninput = (e) => {
    const val = e.target.value;
    ownerSearchUI.empText = val;
    const match = pool.find(emp => `${emp.code} - ${emp.name} (${emp.line})` === val);
    ownerSearchUI.empId = match ? match.id : null;
    ownerSearchUI.expandedLine = null;
    render();
  };
  const monthSel = document.getElementById("osMonth");
  if (monthSel) monthSel.onchange = (e) => { ownerSearchUI.month = e.target.value; render(); };
  const filterSel = document.getElementById("osFilterType");
  if (filterSel) filterSel.onchange = (e) => { ownerSearchUI.filterType = e.target.value; render(); };
  const lifetimeChk = document.getElementById("osLifetime");
  if (lifetimeChk) lifetimeChk.onchange = (e) => { ownerSearchUI.lifetime = e.target.checked; render(); };
  const backBtn = document.getElementById("osBackBtn");
  if (backBtn) backBtn.onclick = () => { ownerSearchUI.empId = null; ownerSearchUI.empText = ""; ownerSearchUI.expandedLine = null; render(); };
  document.querySelectorAll(".os-line-toggle[data-line-toggle]").forEach(btn => {
    btn.onclick = () => {
      const line = btn.dataset.lineToggle;
      ownerSearchUI.expandedLine = ownerSearchUI.expandedLine === line ? null : line;
      render();
    };
  });
}

function bindLinesEvents(){
  const createBtn = document.getElementById("ln_create");
  if (createBtn) createBtn.onclick = async () => {
    const input = document.getElementById("ln_new");
    const code = input.value.trim().toUpperCase();
    if (!code) return;
    createBtn.disabled = true;
    await addLine(code);
  };
  document.querySelectorAll("[data-line-edit]").forEach(btn => {
    btn.onclick = () => { lineUI.editingCode = btn.dataset.lineEdit; render(); };
  });
  const cancelBtn = document.getElementById("ln_edit_cancel");
  document.querySelectorAll("[data-line-cancel]").forEach(btn => {
    btn.onclick = () => { lineUI.editingCode = null; render(); };
  });
  document.querySelectorAll("[data-line-save]").forEach(btn => {
    btn.onclick = async () => {
      const oldCode = btn.dataset.lineSave;
      const input = document.getElementById("ln_edit_input");
      const newCode = input.value.trim().toUpperCase();
      if (!newCode) return;
      lineUI.editingCode = null;
      await renameLine(oldCode, newCode);
    };
  });
  document.querySelectorAll("[data-line-del]").forEach(btn => {
    btn.onclick = () => deleteLine(btn.dataset.lineDel);
  });
}

}

function bindEmployeesEvents(activeLine){
  const s = document.getElementById("empSearch");
  if (s) s.oninput = (e) => { empUI.query = e.target.value; render(); };
  const lineFilt = document.getElementById("empLineFilter");
  if (lineFilt) lineFilt.onchange = (e) => { empUI.lineFilter = e.target.value; render(); };
  const exportBtn = document.getElementById("empExportBtn");
  if (exportBtn) exportBtn.onclick = () => {
    const list = state.employees
      .filter(e => activeLine==="ALL" ? true : e.line===activeLine)
      .filter(e => activeLine!=="ALL" || empUI.lineFilter==="ALL" || e.line===empUI.lineFilter)
      .filter(e => !empUI.query ||
        e.name.toLowerCase().includes(empUI.query.toLowerCase()) ||
        e.code.toLowerCase().includes(empUI.query.toLowerCase()) ||
        (e.line||"").toLowerCase().includes(empUI.query.toLowerCase()));
    exportEmployeesCSV(list);
  };
  const addBtn = document.getElementById("empAddBtn");
  if (addBtn) addBtn.onclick = () => { empUI.showForm = true; empUI.editingId = null; render(); };
  const cancelBtn = document.getElementById("empCancelBtn");
  if (cancelBtn) cancelBtn.onclick = () => { empUI.showForm = false; empUI.editingId = null; render(); };
  const saveBtn = document.getElementById("empSaveBtn");
  if (saveBtn) saveBtn.onclick = async () => {
    if (saveBtn.disabled) return;
    const editingId = empUI.editingId;
    const editingEmp = editingId ? state.employees.find(x => x.id === editingId) : null;
    const code = editingEmp ? editingEmp.code : document.getElementById("f_code").value.trim();
    const name = document.getElementById("f_name").value.trim();
    if (!code || !name) return;
    if (!editingEmp && state.employees.some(x => x.code.trim().toLowerCase() === code.toLowerCase())) {
      alert(`"${code}" আইডি দিয়ে ইতিমধ্যে একজন কর্মচারী আছে। ভিন্ন আইডি ব্যবহার করুন।`);
      return;
    }
    saveBtn.disabled = true;
    const f = {
      code, name,
      phone: document.getElementById("f_phone").value.trim(),
      department: document.getElementById("f_dept").value.trim(),
      designation: document.getElementById("f_desig").value.trim(),
      bloodGroup: document.getElementById("f_blood").value.trim(),
      address: document.getElementById("f_address").value.trim(),
      joinDate: document.getElementById("f_join").value || todayStr(),
      line: activeLine
    };
    empUI.showForm = false;
    empUI.editingId = null;
    if (editingId) { await updateEmployee(editingId, f); } else { await addEmployee(f); }
  };
  document.querySelectorAll("[data-view]").forEach(btn => {
    btn.onclick = () => { empUI.viewingId = btn.dataset.view; render(); };
  });
  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.onclick = () => { empUI.editingId = btn.dataset.edit; empUI.showForm = true; empUI.viewingId = null; render(); };
  });
  document.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.onclick = async () => {
      const emp = state.employees.find(x => x.id === btn.dataset.toggle);
      if (emp && await toggleEmployeeStatus(emp)) { empUI.viewingId = null; render(); }
    };
  });
  document.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = async () => {
      const emp = state.employees.find(x => x.id === btn.dataset.del);
      if (emp && await deleteEmployeeRecord(emp)) { empUI.viewingId = null; render(); }
    };
  });
  document.querySelectorAll("[data-select]").forEach(cb => {
    cb.onchange = (e) => {
      if (e.target.checked) empUI.selected.add(cb.dataset.select);
      else empUI.selected.delete(cb.dataset.select);
      render();
    };
  });
  const delSelectedBtn = document.getElementById("empDeleteSelectedBtn");
  if (delSelectedBtn) delSelectedBtn.onclick = async () => {
    const emps = state.employees.filter(e => empUI.selected.has(e.id));
    if (await deleteEmployeesBulk(emps)) { empUI.selected = new Set(); render(); }
  };
  const delAllBtn = document.getElementById("empDeleteAllBtn");
  if (delAllBtn) delAllBtn.onclick = async () => {
    const scopedList = state.employees.filter(e => activeLine==="ALL" ? true : e.line===activeLine);
    const list = scopedList
      .filter(e => activeLine!=="ALL" || empUI.lineFilter==="ALL" || e.line===empUI.lineFilter)
      .filter(e => !empUI.query ||
        e.name.toLowerCase().includes(empUI.query.toLowerCase()) ||
        e.code.toLowerCase().includes(empUI.query.toLowerCase()) ||
        (e.line||"").toLowerCase().includes(empUI.query.toLowerCase()));
    if (await deleteEmployeesBulk(list)) { empUI.selected = new Set(); render(); }
  };
  const toggleInactiveBtn = document.getElementById("toggleInactiveBtn");
  if (toggleInactiveBtn) toggleInactiveBtn.onclick = () => { empUI.showInactive = !empUI.showInactive; render(); };
  const detailClose = document.getElementById("empDetailClose");
  if (detailClose) detailClose.onclick = () => { empUI.viewingId = null; render(); };
  const detailOverlay = document.getElementById("empDetailOverlay");
  if (detailOverlay) detailOverlay.onclick = (ev) => { if (ev.target===detailOverlay) { empUI.viewingId = null; render(); } };
}

      <div class="att-date-label">তারিখ (Date):</div>
      <input class="att-date-input" id="attDate" type="date" value="${attUI.date}" max="${todayStr()}">
      <input class="pm-search-input" id="attSearch" style="margin-top:10px;" placeholder="নাম বা আইডি খুঁজুন…" value="${esc(attUI.query)}">
      <button class="att-bulk-btn present" style="margin-top:14px;" id="attMarkAllPresent">
        <span class="ic">✔</span>
        <span><span class="lbl-bn">সবাইকে উপস্থিত করুন</span><span class="lbl-en">Mark All Present</span></span>
      </button>
      <button class="att-bulk-btn weekend" style="margin-top:8px;" id="attMarkAllWeekend">
        <span class="ic">☐</span>
        <span><span class="lbl-bn">সবাইকে সাপ্তাহিক ছুটি করুন</span><span class="lbl-en">Mark All Weekend</span></span>
      </button>
    </div>
    <div class="pm-stat-grid">
      <div class="pm-stat-row"><span class="lbl">মোট (Total Manpower)</span><span class="num">${total}</span></div>
      <div class="pm-stat-row ok"><span class="lbl">উপস্থিত (Present)</span><span class="num">${present}</span></div>
      <div class="pm-stat-row danger"><span class="lbl">অনুপস্থিত (Absent)</span><span class="num">${absent}</span></div>
      <div class="pm-stat-row warn"><span class="lbl">ছুটি (Leave)</span><span class="num">${leave}</span></div>
      <div class="pm-stat-row muted"><span class="lbl">চিহ্নিত হয়নি (Unmarked)</span><span class="num">${unmarked}</span></div>
    </div>
    <div class="pm-card-list" style="margin-top:16px;">
      ${employees.length===0 ? `<p class="hint">${q?"কোনো ফলাফল পাওয়া যায়নি":"এই লাইনে অ্যাক্টিভ এমপ্লয়ি নেই"}</p>` : employees.map(e => {
        const rec = recMap[e.id];
        return `
        <div class="att-card">
          <div class="att-card-info">
            <span class="pm-card-id">${esc(e.code)}</span>
            <span class="pm-card-name">${esc(e.name)}</span>
          </div>
          <div class="att-mark-grid">
            ${ATT_STATUSES.map(st => `
              <button class="att-mark-btn ${rec?.status===st?"active-"+st:""}" data-emp="${e.id}" data-status="${st}" title="${STATUS_LABEL[st]}">${STATUS_ABBR[st]}</button>
            `).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function bindAttendanceEvents(activeLine){
  const dateInput = document.getElementById("attDate");
  if (dateInput) dateInput.onchange = (e) => { attUI.date = e.target.value; render(); };
  const searchInput = document.getElementById("attSearch");
  if (searchInput) searchInput.oninput = (e) => { attUI.query = e.target.value; render(); };
  const markAllPresentBtn = document.getElementById("attMarkAllPresent");
  if (markAllPresentBtn) markAllPresentBtn.onclick = async () => {
    const employees = state.employees.filter(e => e.status==="active" && e.line===activeLine);
    if (!confirm(`${employees.length} জনকে আজকের জন্য "উপস্থিত" মার্ক করবেন?`)) return;
    await markAllAttendance(employees, "present", attUI.date);
  };
  const markAllWeekendBtn = document.getElementById("attMarkAllWeekend");
  if (markAllWeekendBtn) markAllWeekendBtn.onclick = async () => {
    const employees = state.employees.filter(e => e.status==="active" && e.line===activeLine);
    if (!confirm(`${employees.length} জনকে আজকের জন্য "সাপ্তাহিক ছুটি" মার্ক করবেন?`)) return;
    await markAllAttendance(employees, "weekend", attUI.date);
  };
  document.querySelectorAll(".att-mark-btn[data-emp]").forEach(btn => {
    btn.onclick = async () => {
      const emp = state.employees.find(e => e.id === btn.dataset.emp);
      await markAttendance(emp, btn.dataset.status, attUI.date);
    };
  });
}

/* ----- Transfers ----- */
let trUI = { showForm: false };

function renderTransfersTab(currentLine, isOwner){
  if (isOwner && currentLine==="ALL") return `<p class="hint">ট্রান্সফার দেখতে/অ্যাপ্রুভ করতে একটি নির্দিষ্ট লাইন সিলেক্ট করুন, অথবা হিস্টরি ট্যাব থেকে সব দেখুন।</p>`;

  const incoming = state.transfers.filter(t => t.status==="pending" && t.toLine===currentLine);
  const outgoing = state.transfers.filter(t => t.fromLine===currentLine);
  const lineEmployees = state.employees.filter(e => e.status==="active" && e.line===currentLine);

  return `
    ${!isOwner ? `<div class="toolbar"><button class="primary-btn" id="trNewBtn">🔁 নতুন ট্রান্সফার রিকোয়েস্ট</button></div>` : ""}
    ${trUI.showForm ? transferFormHtml(lineEmployees, currentLine) : ""}
    <section class="section-block">
      <h3>ইনকামিং রিকোয়েস্ট ${incoming.length>0?`<span class="count-pill">${incoming.length}</span>`:""}</h3>
      ${incoming.length===0 ? `<p class="hint">কোনো পেন্ডিং রিকোয়েস্ট নেই</p>` : incoming.map(t => `
        <div class="transfer-card">
          <div><strong>${esc(t.employeeName)}</strong>
            <div class="hint inline"><span class="line-tag sm">${t.fromLine}</span> → <span class="line-tag sm">${t.toLine}</span> • ${fmtDate(t.requestDate)}</div>
          </div>
          <div class="transfer-actions">
            <button class="icon-btn ok" data-approve="${t.id}" title="অ্যাপ্রুভ">✔</button>
            <button class="icon-btn danger" data-reject="${t.id}" title="রিজেক্ট">✕</button>
          </div>
        </div>`).join("")}
    </section>
    <section class="section-block">
      <h3>আউটগোয়িং রিকোয়েস্ট</h3>
      ${outgoing.length===0 ? `<p class="hint">কোনো রিকোয়েস্ট পাঠানো হয়নি</p>` : outgoing.map(t => `
        <div class="transfer-card">
          <div><strong>${esc(t.employeeName)}</strong>
            <div class="hint inline"><span class="line-tag sm">${t.fromLine}</span> → <span class="line-tag sm">${t.toLine}</span> • ${fmtDate(t.requestDate)}</div>
          </div>
          ${t.status==="pending"
            ? `<div class="transfer-actions">
                 ${statusBadge(t.status)}
                 <button class="icon-btn danger" data-cancel="${t.id}" title="বাতিল">✕</button>
               </div>`
            : statusBadge(t.status)}
        </div>`).join("")}
    </section>
  `;
}

function transferFormHtml(employees, currentLine){
  return `
    <div class="form-card">
      <div class="form-grid">
        <label>এমপ্লয়ি
          <select id="tr_emp"><option value="">বেছে নিন</option>${employees.map(e=>`<option value="${e.id}">${esc(e.code)} — ${esc(e.name)}</option>`).join("")}</select>
        </label>
        <label>কোন লাইনে পাঠাবেন
          <select id="tr_to"><option value="">বেছে নিন</option>${getLines().filter(l=>l!==currentLine).map(l=>`<option value="${l}">${l}</option>`).join("")}</select>
        </label>
      </div>
      <div class="form-actions">
        <button class="ghost-btn" id="trCancelBtn">বাতিল</button>
        <button class="primary-btn" id="trSubmitBtn">✔ রিকোয়েস্ট পাঠান</button>
      </div>
    </div>`;
}

function statusBadge(status){
  if (status==="approved") return `<span class="badge badge-ok">অ্যাপ্রুভড</span>`;
  if (status==="rejected") return `<span class="badge badge-danger">রিজেক্টেড</span>`;
  if (status==="cancelled") return `<span class="badge badge-muted">বাতিলকৃত</span>`;
  return `<span class="badge badge-warn">পেন্ডিং</span>`;
}

function bindTransfersEvents(currentLine, isOwner){
  const newBtn = document.getElementById("trNewBtn");
  if (newBtn) newBtn.onclick = () => { trUI.showForm = true; render(); };
  const cancelBtn = document.getElementById("trCancelBtn");
  if (cancelBtn) cancelBtn.onclick = () => { trUI.showForm = false; render(); };
  const submitBtn = document.getElementById("trSubmitBtn");
  if (submitBtn) submitBtn.onclick = async () => {
    const empId = document.getElementById("tr_emp").value;
    const toLine = document.getElementById("tr_to").value;
    if (!empId || !toLine) return;
    trUI.showForm = false;
    await requestTransfer(empId, toLine);
  };
  document.querySelectorAll("[data-approve]").forEach(btn => {
    btn.onclick = async () => {
      const t = state.transfers.find(x => x.id === btn.dataset.approve);
      await decideTransfer(t, true);
    };
  });
  document.querySelectorAll("[data-reject]").forEach(btn => {
    btn.onclick = async () => {
      const t = state.transfers.find(x => x.id === btn.dataset.reject);
      await decideTransfer(t, false);
    };
  });
  document.querySelectorAll("[data-cancel]").forEach(btn => {
    btn.onclick = async () => {
      const t = state.transfers.find(x => x.id === btn.dataset.cancel);
      if (!t) return;
      if (!confirm("এই ট্রান্সফার রিকোয়েস্টটি বাতিল করতে চান?")) return;
      await cancelTransfer(t);
    };
  });
}

/* ----- History ----- */
let histUI = { selected: new Set() };

function renderHistoryTab(){
  const list = [...state.transfers].sort((a,b) => (b.requestDate||"").localeCompare(a.requestDate||""));
  return `
    ${list.length>0 ? `
    <div class="bulk-action-bar">
      <span class="hint">${histUI.selected.size>0 ? `${histUI.selected.size}টি নির্বাচিত` : "ডিলিটের জন্য নির্বাচন করুন"}</span>
      <div style="display:flex; gap:8px;">
        ${histUI.selected.size>0 ? `<button class="ghost-btn danger-outline" id="histDeleteSelectedBtn">🗑️ নির্বাচিত ডিলিট (${histUI.selected.size})</button>` : ""}
        <button class="ghost-btn danger-outline" id="histDeleteAllBtn">🗑️ সব ডিলিট করুন</button>
      </div>
    </div>` : ""}
    <div class="hist-list">
      ${list.length===0 ? `<p class="hint">কোনো ট্রান্সফার হয়নি</p>` : list.map(t => `
        <div class="hist-card">
          <div class="hist-card-top">
            <div style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" class="pm-card-check" data-hist-select="${t.id}" ${histUI.selected.has(t.id)?"checked":""}>
              <strong class="hist-card-name">${esc(t.employeeName)}</strong>
            </div>
            ${statusBadge(t.status)}
          </div>
          <div class="hist-card-route">
            <span class="line-tag sm">${esc(t.fromLine)}</span>
            <span class="hist-arrow">→</span>
            <span class="line-tag sm">${esc(t.toLine)}</span>
          </div>
          <div class="hist-card-dates">
            <span>অনুরোধ: <span class="mono">${fmtDate(t.requestDate)}</span></span>
            <span>সিদ্ধান্ত: <span class="mono">${t.decisionDate ? fmtDate(t.decisionDate) : "—"}</span></span>
          </div>
        </div>`).join("")}
    </div>
  `;
}

function bindHistoryEvents(){
  const list = [...state.transfers];
  document.querySelectorAll("[data-hist-select]").forEach(cb => {
    cb.onchange = (e) => {
      if (e.target.checked) histUI.selected.add(cb.dataset.histSelect);
      else histUI.selected.delete(cb.dataset.histSelect);
      render();
    };
  });
  const delSelectedBtn = document.getElementById("histDeleteSelectedBtn");
  if (delSelectedBtn) delSelectedBtn.onclick = async () => {
    const sel = list.filter(t => histUI.selected.has(t.id));
    if (await deleteTransfersBulk(sel)) { histUI.selected = new Set(); render(); }
  };
  const delAllBtn = document.getElementById("histDeleteAllBtn");
  if (delAllBtn) delAllBtn.onclick = async () => {
    if (await deleteTransfersBulk(list)) { histUI.selected = new Set(); render(); }
  };
}

/* ----- Owner Dashboard (all-line totals, section-wise breakdown) ----- */
let dashUI = { date: todayStr(), expandedSection: null };

function renderOwnerDashboardTab(){
  const date = dashUI.date;
  const activeEmployees = state.employees.filter(e => e.status === "active");
  const recMap = {};
  state.attendance.filter(a => a.date === date).forEach(a => recMap[a.employeeId] = a);

  const totalActive = activeEmployees.length;
  const totalPresent = activeEmployees.filter(e => recMap[e.id]?.status === "present" || recMap[e.id]?.status === "late").length;
  const totalAbsent = activeEmployees.filter(e => recMap[e.id]?.status === "absent").length;
  const totalLeave = activeEmployees.filter(e => recMap[e.id]?.status === "leave").length;
  const totalUnmarked = activeEmployees.filter(e => !recMap[e.id]).length;

  const sections = DASHBOARD_SECTIONS.map(sec => {
    const emps = activeEmployees.filter(e => sectionForLine(e.line) === sec);
    const desigCounts = {};
    emps.forEach(e => { const d = e.designation || "অনির্ধারিত"; desigCounts[d] = (desigCounts[d]||0)+1; });
    const present = emps.filter(e => recMap[e.id]?.status === "present" || recMap[e.id]?.status === "late").length;
    const absentEmps = emps.filter(e => recMap[e.id]?.status === "absent");
    const leaveEmps = emps.filter(e => recMap[e.id]?.status === "leave");

    const lineMap = {};
    emps.forEach(e => {
      if (!lineMap[e.line]) lineMap[e.line] = { line: e.line, total:0, present:0, absent:0, leave:0, unmarked:0 };
      const row = lineMap[e.line];
      row.total++;
      const st = recMap[e.id]?.status;
      if (st === "present" || st === "late") row.present++;
      else if (st === "absent") row.absent++;
      else if (st === "leave") row.leave++;
      else row.unmarked++;
    });
    const lineRows = Object.values(lineMap).sort((a,b) => a.line.localeCompare(b.line, undefined, {numeric:true, sensitivity:"base"}));

    return { sec, total: emps.length, desigCounts, present, absentEmps, leaveEmps, lineRows };
  });

  return `
    <div class="form-card" style="margin-bottom:16px;">
      <div class="att-date-label">তারিখ (Date):</div>
      <input class="att-date-input" id="dashDate" type="date" value="${date}" max="${todayStr()}">
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${totalActive}</div><div class="lbl">মোট অ্যাক্টিভ এমপ্লয়ি (সব লাইন)</div></div>
      <div class="stat-card ok"><div class="num">${totalPresent}</div><div class="lbl">উপস্থিত</div></div>
      <div class="stat-card danger"><div class="num">${totalAbsent}</div><div class="lbl">অনুপস্থিত</div></div>
      <div class="stat-card warn"><div class="num">${totalLeave}</div><div class="lbl">ছুটি</div></div>
      ${totalUnmarked>0 ? `<div class="stat-card muted"><div class="lbl">⚠️ চিহ্নিত হয়নি (Unmarked)</div><div class="num">${totalUnmarked}</div></div>` : ""}
    </div>
    <button class="export-trigger-btn" id="openReportModalBtn" type="button">📊 মাসিক হাজিরা রিপোর্ট এক্সপোর্ট (Excel/PDF)</button>
    <section class="section-block">
      <h3>📊 সেকশন অনুযায়ী বিস্তারিত</h3>
      <div class="lw-list">
        ${sections.map(s => `
          <div class="lw-card" style="--accent:${SECTION_ACCENTS[s.sec] || "#1F3A5F"}">
            <div class="lw-card-head">
              <span class="lw-card-title">${SECTION_ICONS[s.sec] || ""} ${esc(s.sec)}</span>
              <span class="badge badge-accent">মোট ${s.total}</span>
            </div>
            ${s.total===0 ? `<p class="hint" style="margin:0;">এই সেকশনে কোনো অ্যাক্টিভ কর্মচারী নেই</p>` : `
              <div class="lw-stats-grid" style="grid-template-columns:repeat(auto-fit, minmax(64px,1fr)); border-top:1px dashed var(--line); border-bottom:1px dashed var(--line);">
                ${Object.entries(s.desigCounts).map(([d,c]) => `
                  <div class="lw-stat">
                    <div class="lw-stat-label">${esc(d)}</div>
                    <div class="lw-stat-val">${c}</div>
                  </div>`).join("")}
              </div>
              <div class="pm-stat-grid pm-stat-grid-inline" style="margin:10px 0 0;">
                <div class="pm-stat-row ok"><span class="lbl">উপস্থিত</span><span class="num">${s.present}</span></div>
                <div class="pm-stat-row danger"><span class="lbl">অনুপস্থিত</span><span class="num">${s.absentEmps.length}</span></div>
                <div class="pm-stat-row warn"><span class="lbl">ছুটি</span><span class="num">${s.leaveEmps.length}</span></div>
              </div>
              ${s.sec === "Sewing" ? `
              <div class="table-wrap" style="margin-top:10px;">
                <table style="font-size:11.5px;">
                  <thead><tr>
                    <th>লাইন</th><th style="text-align:center;">মোট</th>
                    <th style="text-align:center;" class="ok-col">উপস্থিত</th>
                    <th style="text-align:center;" class="danger-col">অনুপস্থিত</th>
                    <th style="text-align:center;" class="warn-col">ছুটি</th>
                  </tr></thead>
                  <tbody>
                    ${s.lineRows.map(r => `
                      <tr>
                        <td><span class="line-tag sm">${esc(r.line)}</span></td>
                        <td style="text-align:center;font-weight:700;">${r.total}</td>
                        <td style="text-align:center;color:var(--ok);font-weight:700;">${r.present}</td>
                        <td style="text-align:center;color:var(--danger);font-weight:700;">${r.absent}</td>
                        <td style="text-align:center;color:var(--warn);font-weight:700;">${r.leave}</td>
                      </tr>`).join("")}
                  </tbody>
                </table>
              </div>` : ""}
              ${(s.absentEmps.length + s.leaveEmps.length)>0 ? `
                <div class="lw-card-actions" style="justify-content:flex-start; margin-top:10px;">
                  <button class="ghost-btn" data-toggle-absent="${esc(s.sec)}">
                    ${dashUI.expandedSection===s.sec ? "▲ তালিকা লুকান" : `👁 অনুপস্থিত/ছুটির তালিকা দেখুন (${s.absentEmps.length + s.leaveEmps.length})`}
                  </button>
                </div>
                ${dashUI.expandedSection===s.sec ? renderAbsenteeByLine(s.absentEmps, s.leaveEmps) : ""}
              ` : `<p class="hint" style="margin:10px 0 0;">আজ কেউ অনুপস্থিত বা ছুটিতে নেই</p>`}
            `}
          </div>
        `).join("")}
      </div>
    </section>
  `;
}

function renderAbsenteeByLine(absentEmps, leaveEmps){
  const byLine = {};
  absentEmps.forEach(e => { (byLine[e.line] = byLine[e.line] || []).push({ e, status: "absent" }); });
  leaveEmps.forEach(e => { (byLine[e.line] = byLine[e.line] || []).push({ e, status: "leave" }); });
  const lines = Object.keys(byLine).sort();
  return `
    <div style="margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); max-height:280px; overflow-y:auto;">
      ${lines.map(line => `
        <div style="margin-bottom:8px;">
          <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
            <span class="line-tag sm">${esc(line)}</span>
            <span class="hint inline" style="font-size:10.5px;">(${byLine[line].length} জন)</span>
          </div>
          ${byLine[line].map(({e,status}) => `
            <div class="transfer-card" style="padding:6px 9px; margin-bottom:5px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
              <div style="min-width:0;">
                <strong style="font-size:12px;">${esc(e.name)}</strong>
                <div class="hint inline" style="font-size:10px;">${esc(e.code)} • ${esc(e.designation)||"—"}</div>
              </div>
              <span class="badge ${status==='absent' ? 'badge-danger' : 'badge-warn'}" style="font-size:9.5px; flex-shrink:0;">${status==='absent' ? 'অনুপস্থিত' : 'ছুটি'}</span>
            </div>`).join("")}
        </div>
      `).join("")}
    </div>
  `;
}

function bindOwnerDashboardEvents(){
  const d = document.getElementById("dashDate");
  if (d) d.onchange = (e) => { dashUI.date = e.target.value; render(); };
  document.querySelectorAll("[data-toggle-absent]").forEach(btn => {
    btn.onclick = () => {
      const sec = btn.dataset.toggleAbsent;
      dashUI.expandedSection = (dashUI.expandedSection === sec) ? null : sec;
      render();
    };
  });
  const reportBtn = document.getElementById("openReportModalBtn");
  if (reportBtn) reportBtn.onclick = () => setState({ reportModal: { month: todayStr().slice(0,7), format: "excel" } });
}

render();
</script>
